name: Sync Rosnet to Supabase

on:
  schedule:
    - cron: "10 6 * * *"
    - cron: "10 11 * * *"
  workflow_dispatch:

concurrency:
  group: rosnet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Rosnet sync
        env:
          ROSNET_API_USER: ${{ secrets.ROSNET_API_USER }}
          ROSNET_API_KEY: ${{ secrets.ROSNET_API_KEY }}
          ROSNET_CLIENT_ID: ${{ secrets.ROSNET_CLIENT_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SYNC_LOOKBACK_DAYS: ${{ secrets.SYNC_LOOKBACK_DAYS }}
        run: |
          python sync_rosnet.py
