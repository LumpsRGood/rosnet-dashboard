name: Sync TEST - Store 4456 Only

on:
  workflow_dispatch:

jobs:
  sync-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TEST sync for store 4456
        env:
          ROSNET_API_USER: ${{ secrets.ROSNET_API_USER }}
          ROSNET_API_KEY: ${{ secrets.ROSNET_API_KEY }}
          ROSNET_CLIENT_ID: ${{ secrets.ROSNET_CLIENT_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python sync_test_4456.py
